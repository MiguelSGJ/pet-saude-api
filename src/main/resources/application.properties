spring.application.name=pet-saude-api

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/saude}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway - o schema sempre foi gerenciado por ddl-auto=update, entao qualquer banco existente
# (local, staging, producao) tem tabelas mas nunca teve flyway_schema_history. baseline-version=0
# faz o Flyway tratar esse schema como "ainda em nenhuma migration aplicada" e rodar as migrations
# normalmente, em vez de falhar com "Found non-empty schema but no schema history table".
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Logging
logging.level.com.api.determinantes.sociais=DEBUG

spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:1GB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:1GB}

#cors config
security.cors.allowed-origins=${SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:5173}

#JWT config
security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY:4f6c6153656e686f72416e64726545737461436861766545684d7569746f53656775726132303236}
security.jwt.expiration-time=${SECURITY_JWT_EXPIRATION_TIME:620000}
security.jwt.refreshToken.expiration-time=${SECURITY_JWT_REFRESH_TOKEN_EXPIRATION_TIME:1200000}

#Seed - credenciais do usuario padrao (nao commitar)
seed.user.name=${SEED_USER_NAME:admin}
seed.user.cpf=${SEED_USER_CPF:12345678910}
seed.user.password=${SEED_USER_PASSWORD:admin123}

# Weather enrichment
weather.enabled=${WEATHER_ENABLED:true}
weather.startup-backfill-enabled=${WEATHER_STARTUP_BACKFILL_ENABLED:true}
weather.timezone=${WEATHER_TIMEZONE:America/Fortaleza}
weather.cron=${WEATHER_CRON:0 30 4 * * *}
weather.reconciliation-days=${WEATHER_RECONCILIATION_DAYS:7}
weather.batch-days=${WEATHER_BATCH_DAYS:366}
weather.connect-timeout-millis=${WEATHER_CONNECT_TIMEOUT_MILLIS:10000}
weather.read-timeout-millis=${WEATHER_READ_TIMEOUT_MILLIS:30000}
weather.max-attempts=${WEATHER_MAX_ATTEMPTS:3}
weather.retry-backoff-millis=${WEATHER_RETRY_BACKOFF_MILLIS:1000}
weather.max-daily-precipitation-mm=${WEATHER_MAX_DAILY_PRECIPITATION_MM:500}
weather.max-wind-speed-kmh=${WEATHER_MAX_WIND_SPEED_KMH:300}
weather.job-lock-seconds=${WEATHER_JOB_LOCK_SECONDS:86400}
weather.open-meteo-base-url=${WEATHER_OPEN_METEO_BASE_URL:https://archive-api.open-meteo.com/v1/archive}
weather.nasa-power-base-url=${WEATHER_NASA_POWER_BASE_URL:https://power.larc.nasa.gov/api/temporal/daily/point}
