name: arboviroses

services:
  db:
    image: postgres:16-alpine
    container_name: arboviroses-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arboviroses_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-arboviroses_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  dbgate:
    image: dbgate/dbgate:latest
    container_name: arboviroses-dbgate
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DBGATE_PORT:-8082}:3000"
    restart: unless-stopped

  backend:
    image: ghcr.io/miguelsgj/pet-saude-api:latest
    container_name: arboviroses-backend
    pull_policy: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-arboviroses_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SECURITY_CORS_ALLOWED_ORIGINS: ${SECURITY_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      SECURITY_JWT_SECRET_KEY: ${SECURITY_JWT_SECRET_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      SECURITY_JWT_EXPIRATION_TIME: ${SECURITY_JWT_EXPIRATION_TIME:-3600000}
      SECURITY_JWT_REFRESH_TOKEN_EXPIRATION_TIME: ${SECURITY_JWT_REFRESH_TOKEN_EXPIRATION_TIME:-86400000}
      SEED_USER_NAME: ${SEED_USER_NAME:-admin}
      SEED_USER_CPF: ${SEED_USER_CPF:-12345678910}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-admin123}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 1GB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 1GB
      SERVER_TOMCAT_MAX_HTTP_FORM_POST_SIZE: 1073741824
      SERVER_TOMCAT_MAX_SWALLOW_SIZE: 1073741824
      WEATHER_ENABLED: ${WEATHER_ENABLED:-true}
      WEATHER_STARTUP_BACKFILL_ENABLED: ${WEATHER_STARTUP_BACKFILL_ENABLED:-true}
      WEATHER_TIMEZONE: ${WEATHER_TIMEZONE:-America/Fortaleza}
      WEATHER_CRON: ${WEATHER_CRON:-0 30 4 * * *}
      WEATHER_RECONCILIATION_DAYS: ${WEATHER_RECONCILIATION_DAYS:-7}
      WEATHER_BATCH_DAYS: ${WEATHER_BATCH_DAYS:-366}
      WEATHER_CONNECT_TIMEOUT_MILLIS: ${WEATHER_CONNECT_TIMEOUT_MILLIS:-10000}
      WEATHER_READ_TIMEOUT_MILLIS: ${WEATHER_READ_TIMEOUT_MILLIS:-30000}
      WEATHER_MAX_ATTEMPTS: ${WEATHER_MAX_ATTEMPTS:-3}
      WEATHER_RETRY_BACKOFF_MILLIS: ${WEATHER_RETRY_BACKOFF_MILLIS:-1000}
      WEATHER_MAX_DAILY_PRECIPITATION_MM: ${WEATHER_MAX_DAILY_PRECIPITATION_MM:-500}
      WEATHER_MAX_WIND_SPEED_KMH: ${WEATHER_MAX_WIND_SPEED_KMH:-300}
      WEATHER_JOB_LOCK_SECONDS: ${WEATHER_JOB_LOCK_SECONDS:-86400}
      WEATHER_OPEN_METEO_BASE_URL: ${WEATHER_OPEN_METEO_BASE_URL:-https://archive-api.open-meteo.com/v1/archive}
      WEATHER_NASA_POWER_BASE_URL: ${WEATHER_NASA_POWER_BASE_URL:-https://power.larc.nasa.gov/api/temporal/daily/point}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  python-api:
    build:
      context: ../ArbovirosesPython
      dockerfile: Dockerfile
    container_name: arboviroses-python-api
    restart: unless-stopped

  frontend:
    image: ghcr.io/kaio05/arbovirosesfront:latest
    pull_policy: always
    container_name: arboviroses-frontend
    depends_on:
      - backend
      - python-api
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  postgres_data:
